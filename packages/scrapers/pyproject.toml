[project]
name = "axiom-bills-scrapers"
version = "0.0.1"
description = "Bill scrapers for federal + state legislatures, feeding Axiom."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "selectolax>=0.3.21",
  "click>=8.1",
  "python-dateutil>=2.9",
  "tenacity>=8.3",
  "pyyaml>=6.0",
  "anthropic>=0.104.1",
  "pypdf>=6.14.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-httpx>=0.30", "ruff>=0.5"]

[project.scripts]
axiom-bills = "axiom_bills.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/axiom_bills"]
