[project]
name = "axiom-bills-api"
version = "0.0.1"
description = "Read API for axiom-bills frontend."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "httpx>=0.28.1",
  "axiom-bills-scrapers",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/axiom_bills_api"]

[tool.uv.sources]
axiom-bills-scrapers = { path = "../scrapers", editable = true }
