name: Refresh federal bills

on:
  workflow_dispatch:
    inputs:
      since:
        description: "Optional ISO timestamp cursor. Defaults to Supabase max last_scraped_at."
        required: false
        type: string
      limit:
        description: "Optional bill limit for smoke tests."
        required: false
        type: string
      full_refresh:
        description: "Set to true to ignore the Supabase cursor."
        required: false
        default: "false"
        type: string
      fetch_texts:
        description: "Set to false to skip fetching bill text/diffs."
        required: false
        default: "true"
        type: string
      bills:
        description: "Optional comma-separated bill ids (e.g. hr/372,s/268) to scrape instead of the recent-updates listing. For targeted backfills."
        required: false
        type: string
      congress:
        description: "Optional Congress number for targeted scrapes (bill numbers repeat across Congresses — H.R.7024 exists in the 118th and 119th as unrelated bills)."
        required: false
        type: string
  schedule:
    - cron: "7 * * * *"

concurrency:
  group: refresh-federal-bills
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Cap runtime so a wedged run can't hold the (cancel-in-progress: false)
    # queue for hours. Incremental hourly refreshes finish in minutes; a
    # manual full_refresh scrapes the whole Congress and gets 5 hours.
    timeout-minutes: ${{ inputs.full_refresh == 'true' && 300 || 60 }}
    env:
      CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      REQUESTED_SINCE: ${{ inputs.since || '' }}
      REQUESTED_LIMIT: ${{ inputs.limit || '' }}
      REQUESTED_BILLS: ${{ inputs.bills || '' }}
      REQUESTED_CONGRESS: ${{ inputs.congress || '' }}
      FULL_REFRESH: ${{ inputs.full_refresh || 'false' }}
      FETCH_TEXTS: ${{ inputs.fetch_texts || 'true' }}
      # rulespec-us became a monorepo; the federal tree (and the root all
      # encoding file_paths are relative to) is its us/ subdirectory.
      RULESPEC_US_ROOT: ${{ github.workspace }}/rulespec-us/us
    steps:
      - uses: actions/checkout@v4

      # The encoding pipeline needs the rulespec-us inventory: without it
      # precompute-diffs marks every section "not encoded" and the sync
      # would erase the rulespec matches previous runs computed.
      - name: Check out rulespec-us
        uses: actions/checkout@v4
        with:
          repository: TheAxiomFoundation/rulespec-us
          path: rulespec-us

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Migrate local SQLite
        run: make migrate

      - name: Determine federal cursor
        id: cursor
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${CONGRESS_API_KEY:-}" ]]; then
            echo "::warning::Skipping federal refresh: CONGRESS_API_KEY is not configured."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"

          if [[ "$FULL_REFRESH" == "true" ]]; then
            echo "since=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -n "$REQUESTED_SINCE" ]]; then
            printf 'since=%s\n' "$REQUESTED_SINCE" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          since="$(
            uv run --project packages/scrapers python - <<'PY'
          import os
          import sys
          import httpx

          url = os.environ["SUPABASE_URL"].rstrip("/")
          key = os.environ["SUPABASE_SERVICE_KEY"]
          headers = {
              "apikey": key,
              "Authorization": f"Bearer {key}",
              "Accept-Profile": "bills",
          }
          params = {
              "select": "last_scraped_at",
              "jurisdiction": "eq.us",
              "order": "last_scraped_at.desc",
              "limit": "1",
          }
          response = httpx.get(
              f"{url}/rest/v1/bills",
              params=params,
              headers=headers,
              timeout=30,
          )
          if response.status_code >= 300:
              print(response.text[:500], file=sys.stderr)
              response.raise_for_status()
          rows = response.json()
          if rows:
              print(rows[0]["last_scraped_at"])
          PY
          )"
          printf 'since=%s\n' "$since" >> "$GITHUB_OUTPUT"

      - name: Refresh federal bills
        if: steps.cursor.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail

          scrape_args=(--jurisdiction us)
          if [[ -n "$REQUESTED_BILLS" ]]; then
            # Targeted backfill: scrape exactly these bills, no cursor.
            IFS=',' read -ra _bills <<< "$REQUESTED_BILLS"
            for b in "${_bills[@]}"; do
              scrape_args+=(--bill "$b")
            done
          elif [[ -n "${{ steps.cursor.outputs.since }}" ]]; then
            scrape_args+=(--since "${{ steps.cursor.outputs.since }}")
          fi
          if [[ -n "$REQUESTED_LIMIT" ]]; then
            scrape_args+=(--limit "$REQUESTED_LIMIT")
          fi
          if [[ -n "$REQUESTED_CONGRESS" ]]; then
            scrape_args+=(--congress "$REQUESTED_CONGRESS")
          fi

          echo "Starting federal refresh at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          uv run --project packages/scrapers axiom-bills scrape "${scrape_args[@]}"
          uv run --project packages/scrapers axiom-bills reclassify --jurisdiction us
          uv run --project packages/scrapers axiom-bills reclassify-kinds --jurisdiction us
          # --repo-name keeps the identifier (and the file_path
          # convention) that prod encodings already use.
          uv run --project packages/scrapers axiom-bills index-encodings --repo "$RULESPEC_US_ROOT" --repo-name rulespec-us
          uv run --project packages/scrapers axiom-bills precompute-graph --repo "$RULESPEC_US_ROOT" --repo-name rulespec-us
          if [[ "$FETCH_TEXTS" != "false" ]]; then
            uv run --project packages/scrapers axiom-bills fetch-texts --jurisdiction us
            uv run --project packages/scrapers axiom-bills precompute-diffs --jurisdiction us
            # Enqueue-only scan of the re-encode trigger queue. The
            # local `--run` mode never runs in CI — encoder runs need
            # local corpus/rulespec/engine checkouts and stay human-gated.
            uv run --project packages/scrapers axiom-bills trigger-encodes -j us
            uv run --project packages/scrapers axiom-bills precompute-variants --jurisdiction us
            # Reuse LLM proposals already in Supabase whose inputs are
            # unchanged; only propose for genuinely new/changed variants.
            uv run --project packages/scrapers axiom-bills hydrate-variants
            if [[ -n "${ANTHROPIC_API_KEY:-}" ]]; then
              uv run --project packages/scrapers axiom-bills propose-llm-variants --jurisdiction us --limit 20
              # Reuse reconciliation verdicts already in Supabase whose
              # section fingerprints are unchanged — the fresh SQLite
              # would otherwise re-analyze the same sections hourly.
              uv run --project packages/scrapers axiom-bills hydrate-reconciliations
              # Capped agentic bill↔encoding reconciliation pass:
              # sections with an unchanged input fingerprint are skipped.
              uv run --project packages/scrapers axiom-bills reconcile -j us --limit 10
            else
              echo "::notice::ANTHROPIC_API_KEY not set - skipping LLM variant proposals."
            fi
          fi
          uv run --project packages/scrapers axiom-bills extract-citations --jurisdiction us
          uv run --project packages/scrapers axiom-bills sync-supabase
          echo "Finished federal refresh at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
