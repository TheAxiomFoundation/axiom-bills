name: Tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scrapers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Fetch PostgREST
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: postgrest-v14.18-linux-static-x86-64.tar.xz
          SHA256: 98de1c0be7787aea5f5e11a25f303ea0077634d6fc1000b687bfa825fd27d299
        run: |
          gh release download v14.18 --repo PostgREST/postgrest --pattern "$ARCHIVE" --dir "$RUNNER_TEMP"
          echo "$SHA256  $RUNNER_TEMP/$ARCHIVE" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/$ARCHIVE" -C "$RUNNER_TEMP"
          echo "AXIOM_BILLS_TEST_POSTGREST=$RUNNER_TEMP/postgrest" >> "$GITHUB_ENV"
      - name: Run scraper tests
        env:
          AXIOM_BILLS_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          cd packages/scrapers
          uv sync --extra dev
          uv run python -m pytest -q

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/web/package-lock.json
      - name: Run web tests + typecheck + build
        run: |
          cd packages/web
          npm ci
          npm test
          npx tsc --noEmit
          npm run build
