name: Deploy web (production)

# Auto-deploys packages/web to Vercel production on every push to main.
# This replaces the manual `vercel --prod` step. The native Vercel ↔ GitHub
# Git integration requires a one-time browser OAuth that can't be scripted,
# so we drive the Vercel CLI from Actions instead.
#
# Requires one repo secret: VERCEL_TOKEN
#   Create at https://vercel.com/account/tokens (scope: Pavel Makarchuk's projects),
#   then: gh secret set VERCEL_TOKEN --repo TheAxiomFoundation/axiom-bills
# The project/org IDs below are identifiers, not secrets.

on:
  push:
    branches: [main]
    paths:
      - "packages/web/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

concurrency:
  group: deploy-web-prod
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_kEtxBjMqwxElAI9JWriKTBMJ
      VERCEL_PROJECT_ID: prj_Avn5yAZsSKhyg8I2tFT27bLK1Mop
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    defaults:
      run:
        working-directory: packages/web
    steps:
      - uses: actions/checkout@v4

      - name: Check for VERCEL_TOKEN
        id: guard
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN secret is not set — skipping deploy. Add it in repo Settings → Secrets and variables → Actions."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Install Vercel CLI
        if: steps.guard.outputs.ready == 'true'
        run: npm i -g vercel@latest

      - name: Pull Vercel project settings & env
        if: steps.guard.outputs.ready == 'true'
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        if: steps.guard.outputs.ready == 'true'
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt to production
        if: steps.guard.outputs.ready == 'true'
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
