name: Refresh state bills

on:
  workflow_dispatch:
    inputs:
      state:
        description: "Optional jurisdiction code to refresh, e.g. us-ny"
        required: false
        type: string

concurrency:
  group: refresh-state-bills-${{ inputs.state || 'all' }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      states: ${{ steps.states.outputs.states }}
    steps:
      - id: states
        env:
          REQUESTED_STATE: ${{ inputs.state || '' }}
        run: |
          set -euo pipefail

          if [[ -n "$REQUESTED_STATE" ]]; then
            printf 'states=["%s"]\n' "$REQUESTED_STATE" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' 'states=["us-ak","us-al","us-ar","us-az","us-ca","us-co","us-ct","us-dc","us-de","us-fl","us-ga","us-hi","us-ia","us-id","us-il","us-in","us-ks","us-ky","us-la","us-ma","us-md","us-me","us-mi","us-mn","us-mo","us-ms","us-mt","us-nc","us-nd","us-ne","us-nh","us-nj","us-nm","us-nv","us-ny","us-oh","us-ok","us-or","us-pa","us-ri","us-sc","us-sd","us-tn","us-tx","us-ut","us-va","us-vt","us-wa","us-wi","us-wv","us-wy"]' >> "$GITHUB_OUTPUT"
          fi

  refresh:
    needs: prepare
    runs-on: ubuntu-latest
    # Cap runtime so a wedged run can't hold the (cancel-in-progress: false)
    # queue for hours. A cancelled job syncs nothing, so a scrape that can't
    # finish inside the cap has to stop itself: see the time budget below.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        state: ${{ fromJSON(needs.prepare.outputs.states) }}
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      NYSENATE_API_KEY: ${{ secrets.NYSENATE_API_KEY }}
      INDIANA_API_KEY: ${{ secrets.INDIANA_API_KEY }}
      REQUESTED_STATE: ${{ inputs.state }}
      STATE: ${{ matrix.state }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Migrate local SQLite
        run: make migrate

      - name: Refresh ${{ matrix.state }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${REQUESTED_STATE:-}" && "$REQUESTED_STATE" != "$STATE" ]]; then
            echo "Skipping $STATE: workflow_dispatch requested $REQUESTED_STATE."
            exit 0
          fi

          if [[ "$STATE" == "us-in" && -z "${INDIANA_API_KEY:-}" ]]; then
            echo "Skipping us-in: INDIANA_API_KEY is not configured."
            exit 0
          fi
          if [[ "$STATE" == "us-ny" && -z "${NYSENATE_API_KEY:-}" ]]; then
            if [[ -n "${REQUESTED_STATE:-}" ]]; then
              echo "::error::Can't refresh us-ny: NYSENATE_API_KEY is not configured."
              exit 1
            fi
            echo "::warning::Skipping us-ny: NYSENATE_API_KEY is not configured."
            exit 0
          fi

          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Starting $STATE at $started_at"

          scrape_status=0
          if [[ "$STATE" == "us-ny" ]]; then
            uv run --project packages/scrapers axiom-bills hydrate-refresh-state --jurisdiction "$STATE"
            # The budget leaves 32 of the job's 60 minutes: under a minute to get
            # here, 2.25 for the request in flight when time runs out, and 28 for
            # the steps below, the longest they took after a full New York scrape
            # in June 2026. A budget this size also caps a run at 16,800 bills.
            uv run --project packages/scrapers axiom-bills scrape --jurisdiction "$STATE" --time-budget-minutes 28 || scrape_status=$?
          else
            uv run --project packages/scrapers axiom-bills scrape --jurisdiction "$STATE"
          fi

          # Exit 3 (some bills failed) and exit 4 (out of time) both leave bills
          # worth syncing and a saved place. Anything else stops here, unsynced.
          if [[ "$scrape_status" != 0 && "$scrape_status" != 3 && "$scrape_status" != 4 ]]; then
            echo "::error::$STATE: the scrape failed with exit $scrape_status, so this run synced nothing."
            exit "$scrape_status"
          fi

          uv run --project packages/scrapers axiom-bills reclassify --jurisdiction "$STATE"
          uv run --project packages/scrapers axiom-bills reclassify-kinds --jurisdiction "$STATE"
          uv run --project packages/scrapers axiom-bills extract-citations --jurisdiction "$STATE"
          uv run --project packages/scrapers axiom-bills sync-supabase
          # Only after the sync: the saved state says these bills reached Supabase.
          if [[ "$STATE" == "us-ny" ]]; then
            uv run --project packages/scrapers axiom-bills push-refresh-state --jurisdiction "$STATE"
          fi
          echo "Finished $STATE at $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          if [[ "$scrape_status" == 3 ]]; then
            echo "::error::$STATE: some bills failed. This run synced the rest, and the next run retries the failures."
            exit 3
          fi
          if [[ "$scrape_status" == 4 ]]; then
            echo "::warning::$STATE: the time budget ran out. This run synced what it fetched, and the next run continues from there."
          fi
