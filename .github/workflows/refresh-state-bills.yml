name: Refresh state bills

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      NYSENATE_API_KEY: ${{ secrets.NYSENATE_API_KEY }}
      INDIANA_API_KEY: ${{ secrets.INDIANA_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Migrate local SQLite
        run: make migrate

      - name: Refresh state and DC scrapers
        shell: bash
        run: |
          set -u

          states=(
            us-ak us-al us-ar us-az us-ca us-co us-ct us-dc us-de us-fl
            us-ga us-hi us-ia us-id us-il us-in us-ks us-ky us-la us-ma
            us-md us-me us-mi us-mn us-mo us-ms us-mt us-nc us-nd us-ne
            us-nh us-nj us-nm us-nv us-ny us-oh us-ok us-or us-pa us-ri
            us-sc us-sd us-tn us-tx us-ut us-va us-vt us-wa us-wi us-wv
            us-wy
          )

          failed=0
          for state in "${states[@]}"; do
            if [[ "$state" == "us-in" && -z "${INDIANA_API_KEY:-}" ]]; then
              echo "Skipping us-in: INDIANA_API_KEY is not configured."
              continue
            fi
            if [[ "$state" == "us-ny" && -z "${NYSENATE_API_KEY:-}" ]]; then
              echo "Skipping us-ny: NYSENATE_API_KEY is not configured."
              continue
            fi

            echo "::group::Refresh $state"
            if uv run --project packages/scrapers axiom-bills scrape --jurisdiction "$state"; then
              uv run --project packages/scrapers axiom-bills reclassify --jurisdiction "$state"
              uv run --project packages/scrapers axiom-bills reclassify-kinds --jurisdiction "$state"
              uv run --project packages/scrapers axiom-bills extract-citations --jurisdiction "$state"
            else
              echo "Refresh failed for $state"
              failed=1
            fi
            echo "::endgroup::"
          done

          exit "$failed"

      - name: Sync Supabase
        if: always()
        run: uv run --project packages/scrapers axiom-bills sync-supabase
